<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>QVAC Slang Term Explainer</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(160deg, #f4fff0 0%, #e2ffd6 100%);
    font-family: system-ui, sans-serif;
    color: #274d1e;
    display: flex;
    justify-content: center;
    padding: 46px 20px;
  }
  .wrap { width: 100%; max-width: 520px; text-align: center; }
  .icon { font-size: 2rem; margin-bottom: 4px; }
  h1 { font-size: 1.5rem; margin: 0 0 6px; color: #4a9a1f; font-weight: 800; }
  .subtitle { color: #5f8a4a; margin-bottom: 24px; font-size: 0.9rem; }
  .card {
    background: #f9fff5;
    border: 2px solid #c3ecac;
    border-radius: 20px;
    padding: 30px 26px;
  }
  input[type=text] {
    width: 100%;
    padding: 12px 14px;
    border-radius: 12px;
    border: 2px solid #c3ecac;
    background: #fff;
    color: #274d1e;
    font-family: inherit;
    font-size: 1rem;
    margin-bottom: 16px;
    text-align: center;
  }
  button.action {
    padding: 12px 28px;
    border: none;
    border-radius: 999px;
    font-size: 1rem;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    background: #4a9a1f;
    color: #fff;
    box-shadow: 0 5px 0 #35720f;
    width: 100%;
  }
  button.action:active { transform: translateY(3px); box-shadow: 0 2px 0 #35720f; }
  button.action:disabled { opacity: 0.4; cursor: not-allowed; }
  .status { margin-top: 14px; font-size: 0.85rem; color: #5f8a4a; min-height: 1.2em; }
  .result-block { text-align: left; margin-top: 20px; }
  .result-label { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 700; color: #5f8a4a; margin-bottom: 4px; }
  .result-body { font-size: 1rem; line-height: 1.55; margin: 0 0 16px; color: #274d1e; background: #eaf9df; border-radius: 12px; padding: 12px 14px; }
  .footer-note { color: #5f8a4a; font-size: 0.78rem; margin-top: 20px; }
  .spinner {
    display: inline-block;
    width: 13px; height: 13px;
    border: 2px solid #c3ecac;
    border-top-color: #4a9a1f;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    vertical-align: middle;
    margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="wrap">
    <div class="icon">🗣️</div>
    <h1>QVAC Slang Term Explainer</h1>
    <p class="subtitle">Enter a slang term or idiom, get a plain-English explanation. 100% on-device.</p>

    <div class="card">
      <input type="text" id="termInput" placeholder="e.g. spill the tea, ghosted, bet" />
      <button class="action" id="generateBtn">Explain It</button>
      <div class="status" id="status"></div>
      <div class="result-block" id="resultBlock"></div>
    </div>

    <p class="footer-note">Everything runs locally on your machine. No text ever leaves this device.</p>
  </div>

  <script>
    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    const termInput = document.getElementById('termInput');
    const generateBtn = document.getElementById('generateBtn');
    const status = document.getElementById('status');
    const resultBlock = document.getElementById('resultBlock');

    async function generate() {
      const term = termInput.value.trim();
      if (!term) return;
      generateBtn.disabled = true;
      resultBlock.innerHTML = '';
      status.innerHTML = '<span class="spinner"></span>Translating from slang...';

      try {
        const res = await fetch('/api/explain', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ term }),
        });
        const data = await res.json();
        if (data.error) throw new Error(data.error);

        status.textContent = '';
        resultBlock.innerHTML = `
          <div class="result-label">Meaning</div>
          <div class="result-body">${escapeHtml(data.meaning)}</div>
          <div class="result-label">Example</div>
          <div class="result-body">${escapeHtml(data.example)}</div>
        `;
      } catch (err) {
        status.textContent = 'Error: ' + err.message;
      } finally {
        generateBtn.disabled = false;
      }
    }

    generateBtn.addEventListener('click', generate);
    termInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') generate(); });
  </script>
</body>
</html>
